dataset: porto_hoser
data_dir: ../data/porto_hoser
num_gene: 5000
beam_width: 4
seed: 42
cuda_device: 0
od_sources:
- train
- test
grid_size: 0.001
edr_eps: 100.0
skip_gene: false
skip_eval: false
force: false
run_scenarios: true
scenarios_config: config/scenarios_porto.yaml
run_abnormal_detection: true
abnormal_config: config/abnormal_detection.yaml
wandb:
  enable: true
  project: hoser-porto-eval
  background_sync: true
logging:
  verbose: false

# Within-dataset evaluation (no translation needed)
# source_dataset: porto_hoser      # Same as dataset - no translation
# target_dataset: porto_hoser      # Same as dataset - no translation  
# translation_max_distance: 20.0   # Not used in within-dataset
# Translation is automatically disabled for same source/target datasets

# Analysis-focused workflow (skip generation, use real abnormal data)
skip_generation: false             # Enable generation for LM-TAD evaluation
# When skip_generation=false, trajectory generation and LM-TAD evaluation are performed
# Porto Grid Configuration for LM-TAD evaluation
# Grid dimensions that match teacher model expectations
porto_grid_config:
  grid_size: 0.001
  expected_dimensions:
    height: 46
    width: 134
  # If these are missing, the system will compute boundaries as fallback
